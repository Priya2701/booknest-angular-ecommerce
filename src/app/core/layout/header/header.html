<div class="promo">
  <div class="container">Free shipping on orders over $35</div>
</div>
<header class="header">
  <div class="container header__bar">
    <a routerLink="/" class="logo" aria-label="BookNest home" (click)="closeMenu()">
      <svg class="logo__mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="currentColor" />
        <path d="M8 9h6.5c1.4 0 2.5.6 3 1.5.5-.9 1.6-1.5 3-1.5H24v14h-3.5c-1.4 0-2.5.6-3 1.5-.5-.9-1.6-1.5-3-1.5H8V9Z" fill="#f4b942" />
        <path d="M17.5 10.5v13" stroke="currentColor" stroke-width="1.5" />
      </svg>
      <span>BookNest</span>
    </a>

    <div class="header__nav">
      <app-navigation [links]="links" />
    </div>

    <a routerLink="/cart" class="cart" [attr.aria-label]="cartLabel()" (click)="closeMenu()">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M3 4h2l2.4 11h10.2L20 7H6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="9" cy="19.5" r="1.5" fill="currentColor" />
        <circle cx="17" cy="19.5" r="1.5" fill="currentColor" />
      </svg>
      <span class="cart__label" aria-hidden="true">Cart</span>
      @if (cart.count() > 0) {
        <span class="cart__badge" aria-hidden="true">{{ cart.count() }}</span>
      }
    </a>

    <button
      type="button"
      class="menu-toggle"
      aria-controls="mobile-menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      {{ menuOpen() ? 'Close' : 'Menu' }}
    </button>
  </div>

  @if (menuOpen()) {
    <div id="mobile-menu" class="container mobile-menu">
      <app-navigation
        [links]="links"
        orientation="vertical"
        label="Mobile navigation"
        (navigated)="closeMenu()"
      />
    </div>
  }
</header>
