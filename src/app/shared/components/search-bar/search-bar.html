<form class="search" role="search" (submit)="onSubmit($event, field.value)">
  <label class="visually-hidden" [for]="inputId">{{ label() }}</label>
  <svg class="search__icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
    <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
    <path d="M16.5 16.5 21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  </svg>
  <input
    #field
    [id]="inputId"
    class="search__input"
    type="search"
    name="q"
    autocomplete="off"
    maxlength="100"
    [placeholder]="placeholder()"
    [value]="value()"
  />
  <button type="submit" class="search__submit">Search</button>
</form>
